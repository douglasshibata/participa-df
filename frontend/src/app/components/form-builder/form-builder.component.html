<div class="container-fluid py-4">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">Componentes</div>
        <div class="card-body">
          <div
            cdkDropList
            #availableList="cdkDropList"
            [cdkDropListData]="availableFields"
            [cdkDropListConnectedTo]="[canvasList]"
            class="list-group"
          >
            <div
              *ngFor="let item of availableFields"
              cdkDrag
              class="list-group-item list-group-item-action cursor-move mb-2 border rounded d-flex align-items-center"
            >
              <span class="material-icons me-2">drag_indicator</span> {{ item.label }}
            </div>
          </div>
        </div>
      </div>

      <!-- Config Panel -->
      <div class="card shadow-sm" *ngIf="selectedField">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          Configuração
          <button class="btn btn-sm btn-outline-light" (click)="selectedField = null">X</button>
        </div>
        <div class="card-body">
          <form [formGroup]="configForm">
            <div class="mb-3">
              <label class="form-label">Label</label>
              <input type="text" formControlName="label" class="form-control form-control-sm">
            </div>
            <div class="mb-3">
              <label class="form-label">Placeholder</label>
              <input type="text" formControlName="placeholder" class="form-control form-control-sm">
            </div>
            <div class="mb-3">
              <label class="form-label">Grade (Bootstrap)</label>
              <select formControlName="bootstrapClass" class="form-select form-select-sm">
                <option value="col-md-12">col-md-12 (Full)</option>
                <option value="col-md-6">col-md-6 (Half)</option>
                <option value="col-md-4">col-md-4 (Third)</option>
                <option value="col-md-3">col-md-3 (Quarter)</option>
              </select>
            </div>
            <div class="mb-3 row">
              <div class="col-6">
                <label class="form-label">Texto</label>
                <input type="color" formControlName="textColor" class="form-control form-control-color w-100">
              </div>
              <div class="col-6">
                <label class="form-label">Fundo</label>
                <input type="color" formControlName="backgroundColor" class="form-control form-control-color w-100">
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Canvas -->
    <div class="col-md-6">
      <div class="card shadow-sm min-vh-75">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
          Canvas do Formulário
          <span class="badge bg-secondary">{{ formFields.length }} campos</span>
        </div>
        <div class="card-body bg-light bg-opacity-10">
          <div
            cdkDropList
            #canvasList="cdkDropList"
            [cdkDropListData]="formFields"
            (cdkDropListDropped)="drop($event)"
            class="p-3 border border-dashed rounded min-vh-50"
            style="min-height: 400px; border: 2px dashed #ccc;"
          >
            <div
              *ngFor="let field of formFields"
              cdkDrag
              (click)="selectField(field)"
              class="p-3 mb-2 bg-white border rounded shadow-sm cursor-pointer position-relative"
              [class.border-primary]="selectedField === field"
            >
              <div class="d-flex justify-content-between align-items-center mb-2">
                <small class="text-muted text-uppercase fw-bold">{{ field.type }}</small>
                <span class="material-icons text-muted">open_with</span>
              </div>
              <div class="row">
                 <div [class]="field.bootstrapClass">
                    <label [ngStyle]="field.customStyles" class="form-label p-1 rounded">{{ field.label }}</label>
                    <input [type]="field.type" class="form-control" [placeholder]="field.placeholder" disabled>
                 </div>
              </div>
            </div>
            <div *ngIf="formFields.length === 0" class="text-center text-muted mt-5">
              Arrasta componentes aqui para começar a construir seu formulário.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JSON Preview -->
    <div class="col-md-3">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-success text-white">JSON Real-time</div>
        <div class="card-body p-0">
          <pre class="bg-dark text-success p-3 m-0 small" style="height: 100%; overflow-y: auto;">{{ jsonOutput }}</pre>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview Section -->
  <div class="row mt-5">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header bg-info text-white">Preview Final (FormRenderer)</div>
        <div class="card-body">
          <app-form-renderer [fields]="formFields"></app-form-renderer>
        </div>
      </div>
    </div>
  </div>
</div>
