services:
  db:
    image: postgres:15-alpine
    container_name: participadf-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: participadf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d participadf"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: participadf-backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/participadf
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/temp_uploads:/app/temp_uploads

  frontend:
    build:
      context: ./frontend
    container_name: participadf-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
